<!doctype html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NO MIRES ATRÁS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05000d;color:#fff;font-family:Arial,sans-serif}
body{touch-action:none}
#game{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 25%,#25004a 0,#090014 45%,#020006 100%)}
#hud{height:72px;display:flex;justify-content:space-around;align-items:center;font-weight:800;font-size:14px;text-shadow:0 0 10px #ff00e6}
.stat{text-align:center}.value{font-size:20px;color:#00f6ff}
#road{position:relative;flex:1;overflow:hidden;margin:0 12px 14px;border:2px solid #ff00d9;border-radius:18px;background:linear-gradient(90deg,transparent 0 32%,rgba(255,0,217,.18) 32% 33%,transparent 33% 66%,rgba(0,246,255,.18) 66% 67%,transparent 67%),linear-gradient(#120021,#03000a);box-shadow:0 0 25px #ff00d9aa,inset 0 0 35px #00f6ff33}
.lane{position:absolute;top:0;bottom:0;width:1px;background:#00f6ff55}.l1{left:33.33%}.l2{left:66.66%}
#player{position:absolute;bottom:12%;width:52px;height:68px;border-radius:22px 22px 12px 12px;background:linear-gradient(#00f6ff,#7a00ff);box-shadow:0 0 22px #00f6ff;transition:left .12s;z-index:5}
#player:before{content:"";position:absolute;left:12px;top:-20px;width:28px;height:28px;border-radius:50%;background:#ddd;box-shadow:0 0 15px #fff}
#player:after{content:"";position:absolute;left:7px;bottom:-12px;width:38px;height:12px;background:#ff00d9;filter:blur(7px);border-radius:50%}
.obstacle{position:absolute;width:46px;height:46px;border-radius:9px;background:#ff165d;box-shadow:0 0 22px #ff165d;z-index:4}
.coin{position:absolute;width:24px;height:24px;border:4px solid #ffe600;border-radius:50%;box-shadow:0 0 18px #ffe600;z-index:3}
#monster{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:72px;height:88px;border-radius:40px 40px 18px 18px;background:#160020;box-shadow:0 0 30px #ff003c;opacity:.65;z-index:2}
#monster:before{content:"👹";position:absolute;font-size:58px;left:6px;top:10px;filter:drop-shadow(0 0 8px #ff003c)}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#020006cc;z-index:20;padding:30px}
.card{border:2px solid #ff00d9;border-radius:22px;padding:28px 22px;background:#0b0015eF;box-shadow:0 0 35px #ff00d9aa;max-width:330px}
h1{font-size:30px;margin:0 0 10px;color:#fff;text-shadow:0 0 14px #ff00d9}p{color:#ddd;line-height:1.4}
button{border:0;border-radius:14px;padding:15px 26px;background:linear-gradient(90deg,#ff00d9,#7a00ff);color:white;font-weight:900;font-size:17px;box-shadow:0 0 20px #ff00d9aa}
.small{font-size:12px;color:#aaa;margin-top:14px}
.hidden{display:none!important}

/* Neon city upgrades */
#road:before{content:"";position:absolute;inset:0;pointer-events:none;background:
linear-gradient(90deg,transparent 0 8%,#ff00d933 8% 9%,transparent 9% 20%,#00f6ff22 20% 21%,transparent 21% 79%,#ff00d922 79% 80%,transparent 80% 92%,#00f6ff33 92% 93%,transparent 93%),
repeating-linear-gradient(0deg,transparent 0 90px,#ff00d91a 91px 93px,transparent 94px 150px);opacity:.9}
#city{position:absolute;inset:0;pointer-events:none;z-index:1}
.building{position:absolute;bottom:0;width:12%;background:linear-gradient(#18002c,#07000e);border:1px solid #00f6ff55;box-shadow:0 0 18px #00f6ff22}
.window{position:absolute;width:5px;height:9px;background:#ff00d9;box-shadow:0 0 8px #ff00d9}
#monster{transition:transform .15s,filter .15s}
#power{position:absolute;left:14px;bottom:18px;width:110px;height:8px;border:1px solid #00f6ff;border-radius:10px;z-index:8;display:none}
#power i{display:block;height:100%;width:100%;background:#00f6ff;box-shadow:0 0 10px #00f6ff;border-radius:10px}
#flash{position:absolute;inset:0;background:#ff003c;opacity:0;z-index:19;pointer-events:none}
.skinbar{display:flex;gap:8px;justify-content:center;margin:12px 0}.skin{padding:8px 10px;border:1px solid #00f6ff;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="stat">DISTANCIA<div id="distance" class="value">0 m</div></div>
    <div class="stat">MONEDAS<div id="coins" class="value">0</div></div>
    <div class="stat">RÉCORD<div id="best" class="value">0 m</div></div>
  </div>
  <div id="road">
    <div id="city"></div><div class="lane l1"></div><div class="lane l2"></div>
    <div id="monster"></div><div id="player"></div><div id="power"><i></i></div><div id="flash"></div>
    <div id="message">
      <div class="card">
        <h1>NO MIRES ATRÁS</h1>
        <p>Corre. Esquiva. Recoge monedas.<br><b>No dejes que te alcance.</b></p>
        <button id="start">JUGAR</button>
        <div class="small">Desliza ← → para cambiar de carril</div>
      </div>
    </div>
  </div>
</div>
<script>
const road=document.getElementById('road'),player=document.getElementById('player'),msg=document.getElementById('message');
const distanceEl=document.getElementById('distance'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best');
let lane=1,dist=0,coins=0,speed=5,running=false,last=0,spawn=0,coinSpawn=0,objects=[];
let best=+localStorage.noMiresBest||0; bestEl.textContent=best+' m';
let fear=0,flashTimer=0;
function buildCity(){const c=document.getElementById('city'); for(let i=0;i<12;i++){let b=document.createElement('div');b.className='building';b.style.left=(i*9+Math.random()*3)+'%';b.style.height=(80+Math.random()*150)+'px';for(let j=0;j<8;j++){let w=document.createElement('span');w.className='window';w.style.left=(8+Math.random()*70)+'%';w.style.top=(8+j*11)+'%';b.appendChild(w)}c.appendChild(b)}}
buildCity();

function setPlayer(){let w=road.clientWidth; player.style.left=(w*(lane+.5)/3-26)+'px'}
function reset(){fear=0;document.getElementById("power").style.display="block";objects.forEach(o=>o.el.remove());objects=[];lane=1;dist=0;coins=0;speed=5;spawn=0;coinSpawn=0;distanceEl.textContent='0 m';coinsEl.textContent='0';setPlayer()}
function make(type,l){let el=document.createElement('div');el.className=type;road.appendChild(el);let x=road.clientWidth*(l+.5)/3-(type==='coin'?12:23);el.style.left=x+'px';el.style.top='-55px';let o={el,l,y:-55,type};objects.push(o)}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function gameOver(){running=false;document.getElementById("power").style.display="none";let score=Math.floor(dist);if(score>best){best=score;localStorage.noMiresBest=best}bestEl.textContent=best+' m';msg.querySelector('h1').textContent='TE HAN ALCANZADO';msg.querySelector('p').innerHTML=`Has recorrido <b>${score} m</b> y conseguido <b>${coins}</b> monedas.`;msg.querySelector('button').textContent='VOLVER A JUGAR';msg.querySelector('.small').textContent='¿Puedes superar tu récord?';msg.classList.remove('hidden')}
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;dist+=dt*.012*speed;speed+=dt*.00012;distanceEl.textContent=Math.floor(dist)+' m';spawn-=dt;fear=Math.min(100,dist/35);document.getElementById('monster').style.transform=`translateX(-50%) translateY(${-fear*.35}px) scale(${1+fear/220})`;document.getElementById('power').style.display='block';document.querySelector('#power i').style.width=Math.max(5,100-fear)+'%';coinSpawn-=dt;
if(spawn<=0){make('obstacle',Math.floor(Math.random()*3));spawn=Math.max(420,900-speed*45)}
if(coinSpawn<=0){make('coin',Math.floor(Math.random()*3));coinSpawn=650+Math.random()*700}
let pr=player.getBoundingClientRect();let rr=road.getBoundingClientRect();
objects.forEach(o=>{o.y+=speed*dt/7;o.el.style.top=o.y+'px';let r=o.el.getBoundingClientRect();let A={x:pr.left,y:pr.top,w:pr.width,h:pr.height},B={x:r.left,y:r.top,w:r.width,h:r.height};
if(collide(A,B)){if(o.type==='coin'){coins++;coinsEl.textContent=coins;o.el.remove();o.dead=true}else {document.getElementById('flash').style.opacity='.25';setTimeout(()=>document.getElementById('flash').style.opacity='0',90);fear=Math.min(100,fear+18);o.el.remove();o.dead=true;if(fear>=100) gameOver()}}
if(o.y>road.clientHeight+80){o.el.remove();o.dead=true}});
objects=objects.filter(o=>!o.dead);requestAnimationFrame(loop)}
function start(){reset();msg.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;
let sx=0,sy=0;
road.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
road.addEventListener('touchend',e=>{if(!running)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35){lane=Math.max(0,Math.min(2,lane+(dx>0?1:-1)));setPlayer()}});
window.addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft'){lane=Math.max(0,lane-1);setPlayer()}if(e.key==='ArrowRight'){lane=Math.min(2,lane+1);setPlayer()}});
setPlayer();
</script>
</body>
</html>
